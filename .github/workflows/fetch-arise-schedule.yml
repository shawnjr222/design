# Refresh the Arise (WellnessLiving) schedule at the start of each week. The static
# JSON covers a rolling 45-day window, so a weekly refresh keeps the site's
# "next 30 days" view full. The site is redeployed only when the schedule changed.
name: Fetch Arise schedule

on:
  schedule:
    - cron: '15 14 * * 1' # Mondays 07:15 PT (GitHub may start scheduled runs late)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # lets this job start the Pages deploy (commits made with GITHUB_TOKEN can't trigger it)

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape Arise
        env:
          ARISE_DAYS: '45'
        run: npm run fetch:arise

      - name: Commit if classes changed
        id: commit
        run: |
          # Compare only the class list; fetchedAt changes on every run.
          old=$(git show HEAD:public/data/arise-schedule.json | jq -c .classes)
          new=$(jq -c .classes public/data/arise-schedule.json)
          if [ "$old" = "$new" ]; then
            echo "No schedule changes"
            git checkout -- public/data/arise-schedule.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/arise-schedule.json
          git commit -m "chore: refresh Arise schedule (rolling window)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site if classes changed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
