name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  # The daily Arise scrape commits with GITHUB_TOKEN, and GitHub doesn't let those
  # commits trigger `push` workflows. Redeploy whenever the scrape finishes instead.
  workflow_run:
    workflows: [Fetch Arise schedule]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip if the scrape itself failed; the last good data stays live.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: main   # include the scrape's fresh commit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
